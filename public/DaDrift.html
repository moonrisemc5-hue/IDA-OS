<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov'),ovc=document.getElementById('ovc');
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,wrap=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a};

let LAPS=3;const RW=200,LIM=105,MAXV=1250;
/* ---------- TRACK ---------- */

const THEMES=[
{g:'#2d6a3b',a:'20,70,35',b:'80,150,80',road:'#3a3d45',sand:'#d6c28a',k:['#e63946','#f4f4f4'],t:['#1d5a2a','#2f7d3c'],ty:0},
{g:'#d8b36a',a:'170,130,60',b:'235,205,140',road:'#3b3a3c',sand:'#c79a52',k:['#d2691e','#f4f4f4'],t:['#2e7d32','#4caf50'],ty:2},
{g:'#1f5a2b',a:'8,40,20',b:'40,120,60',road:'#33363b',sand:'#7a6a3a',k:['#ffb300','#2b2b2b'],t:['#0f4a22','#1f8a3a'],ty:0},
{g:'#6aa86a',a:'50,110,60',b:'255,190,210',road:'#43434b',sand:'#e8d7c0',k:['#e75480','#ffffff'],t:['#e0608f','#ffb7d0'],ty:0},
{g:'#2a5a30',a:'15,50,25',b:'60,110,60',road:'#3a3d45',sand:'#a38760',k:['#c0392b','#eeeeee'],t:['#14401f','#256b35'],ty:1},
{g:'#e9f1f7',a:'190,210,230',b:'255,255,255',road:'#4a5160',sand:'#cfe3f0',k:['#2d7dff','#ffffff'],t:['#a9d3ee','#e8f6ff'],ty:0}];
const MAPS=[[[1300,200],[1900,220],[2300,420],[2350,800],[2000,1000],[1700,1250],[2000,1550],[1500,1650],[1000,1500],[700,1650],[300,1450],[300,950],[650,750],[500,450],[850,250]],
[[800,300],[1700,200],[2400,300],[2600,800],[2500,1300],[1800,1500],[1000,1400],[400,1000],[400,600]],
[[700,300],[1300,200],[1900,400],[2400,300],[2800,700],[2600,1100],[2200,1300],[2500,1650],[1900,1800],[1400,1500],[900,1750],[400,1500],[500,1050],[900,800],[500,600]],
[[900,300],[1600,250],[2200,350],[2700,600],[2800,1000],[2400,1250],[1900,1100],[1500,1350],[1900,1650],[1300,1800],[700,1600],[450,1100],[600,700]],
[[500,400],[1500,300],[2500,350],[2900,700],[2500,1000],[1600,900],[1000,1100],[1500,1400],[2400,1500],[2700,1800],[1800,1900],[800,1800],[350,1300],[300,800]],
[[700,400],[1400,300],[1800,650],[2300,350],[2800,600],[2700,1100],[2200,1200],[2600,1600],[2000,1850],[1500,1500],[1000,1800],[450,1500],[500,1000],[900,750]]];
function cr(a,b,c,d,t){const t2=t*t,t3=t2*t;return[0,1].map(i=>.5*(2*b[i]+(-a[i]+c[i])*t+(2*a[i]-5*b[i]+4*c[i]-d[i])*t2+(-a[i]+3*b[i]-3*c[i]+d[i])*t3))}
let S,N,M,ang,curv,TP,CP,BB,vl,DS;
const angs=P=>P.map((p,i)=>{const q=P[(i+1)%P.length];return Math.atan2(q[1]-p[1],q[0]-p[0])});
function loadMap(k){TH=THEMES[k];CUR=k;mkPat(TH);CP=MAPS[k].map(p=>[p[0]*2,p[1]*2]);N=CP.length;const R=[];for(let i=0;i<N;i++)for(let j=0;j<30;j++)R.push(cr(CP[(i+N-1)%N],CP[i],CP[(i+1)%N],CP[(i+2)%N],j/30));
 const a0=angs(R),n=R.length;let bs=0,bv=1e9;for(let i=0;i<n;i++){let v=0;for(let j=-15;j<=3;j++)v+=Math.abs(wrap(a0[(i+j+n)%n]-a0[(i+j+1+n)%n]));if(v<bv){bv=v;bs=i}}
 S=R.slice(bs).concat(R.slice(0,bs));M=S.length;ang=angs(S);curv=ang.map((_,i)=>{let q=0;for(let j=0;j<12;j++)q+=Math.abs(wrap(ang[(i+j+1)%M]-ang[(i+j)%M]));return q});
 DS=0;for(let i=0;i<M;i++){const q=S[(i+1)%M];DS+=Math.hypot(q[0]-S[i][0],q[1]-S[i][1])}DS/=M;
 const kp=ang.map((a,i)=>Math.abs(wrap(ang[(i+1)%M]-a))/DS);vl=kp.map((_,i)=>{let m=0;for(let k=0;k<8;k++)m=Math.max(m,kp[(i+k)%M]);return clamp(2/(m+.0009),360,1700)});
 TP=new Path2D();S.forEach((p,i)=>i?TP.lineTo(p[0],p[1]):TP.moveTo(p[0],p[1]));TP.closePath();
 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;S.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])});BB=[x0-100,y0-100,x1-x0+200,y1-y0+200];buildTrees()}
let GP,TH;
function mkPat(th){const pc=document.createElement('canvas');pc.width=pc.height=256;const px=pc.getContext('2d');px.fillStyle=th.g;px.fillRect(0,0,256,256);
 for(let i=0;i<500;i++){px.fillStyle=`rgba(${Math.random()<.5?th.a:th.b},${.08+Math.random()*.1})`;px.fillRect(Math.random()*256,Math.random()*256,3+Math.random()*10,2+Math.random()*4)}GP=ctx.createPattern(pc,'repeat')}
let DC=[],CUR=0;const HC=['#c0392b','#d35400','#8e6e53','#34495e','#7f8c8d'],BO=document.querySelector('#tc .bo');
const DCS=[[['house',70,20,34],['bld',22,400,60],['pond',3,200,110]],[['mtn',14,500,260],['palm',50,40,38],['rock',40,20,16],['pond',2,250,90]],[['palm',90,30,46],['pond',5,200,120],['rock',20,40,20]],[['pagoda',22,120,40],['pond',4,200,110],['house',30,60,30]],[['cabin',22,120,32],['pond',3,250,130],['rock',30,40,20],['mtn',8,700,230]],[['igloo',20,100,34],['mtn',14,500,260],['ice',24,50,40],['pond',3,250,120]]];
function buildDecor(){DC=[];for(const[k,n,ex,sz]of DCS[CUR]){let c=0;for(let t=0;c<n&&t<n*40;t++){const r=sz*(.7+Math.random()*.6),x=-400+Math.random()*6000,y=-400+Math.random()*4400;let b=1e18;for(const q of S){const d=(q[0]-x)**2+(q[1]-y)**2;if(d<b)b=d}
 if(b>(RW/2+LIM+60+ex+r*.6)**2){DC.push({k,x,y,r,a:Math.random()*TAU,v:Math.floor(Math.random()*5),pts:Array.from({length:8},()=>.7+Math.random()*.5)});c++}}}DC.sort((a,b)=>b.r-a.r)}
function decor(o){const g=ctx,r=o.r,snow=TH.g==='#e9f1f7',des=TH.g==='#d8b36a';g.save();g.translate(o.x,o.y);
 if(o.k==='pond'){g.fillStyle=snow?'#a9d6f0':'#3b8bd6';g.beginPath();g.ellipse(0,0,r*1.3,r,o.a,0,TAU);g.fill();g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=4;g.stroke()}
 else if(o.k==='mtn'){g.rotate(o.a);const P=o.pts,m1=snow?'#9fb7cc':des?'#8f6a42':'#5b6b5a',m2=snow?'#e8f2fa':des?'#c19a68':'#8a9b84';
  const poly=q=>{g.beginPath();P.forEach((w,i)=>{const t=i/8*TAU;g[i?'lineTo':'moveTo'](Math.cos(t)*r*w*q,Math.sin(t)*r*w*q)});g.closePath()};
  g.fillStyle='rgba(0,0,0,.25)';g.save();g.translate(14,18);poly(1);g.fill();g.restore();g.fillStyle=m1;poly(1);g.fill();
  g.save();g.beginPath();g.rect(-r*2,-r*2,r*2,r*4);g.clip();g.fillStyle=m2;poly(.72);g.fill();g.restore();g.fillStyle=snow?'#fff':m2;poly(.3);g.fill()}
 else if(o.k==='house'||o.k==='cabin'){g.rotate(o.a);const w=r*1.6,h=r*1.1;g.fillStyle='rgba(0,0,0,.28)';g.fillRect(-w/2+6,-h/2+8,w,h);g.fillStyle=o.k==='cabin'?'#7a5230':HC[o.v];g.fillRect(-w/2,-h/2,w,h);g.fillStyle='rgba(255,255,255,.22)';g.fillRect(-w/2,-h/2,w,h/2);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(-w/2,-1.5,w,3)}
 else if(o.k==='bld'){g.rotate(o.a);const w=r*1.8,h=r*1.5;g.fillStyle='rgba(0,0,0,.3)';g.fillRect(-w/2+14,-h/2+16,w,h);g.fillStyle=['#6b7788','#8a94a3','#55606f'][o.v%3];g.fillRect(-w/2,-h/2,w,h);g.fillStyle='rgba(255,255,255,.18)';g.fillRect(-w/2+6,-h/2+6,w-12,h-12);g.fillStyle='rgba(255,230,140,.7)';for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)g.fillRect(i*w/6-3,j*h/6-3,6,6)}
 else if(o.k==='palm'){g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.arc(8,10,r*.8,0,TAU);g.fill();for(let j=0;j<8;j++){g.save();g.rotate(o.a+j*TAU/8);g.fillStyle=j%2?'#2e8b3a':'#3fae4c';g.beginPath();g.ellipse(r*.55,0,r*.6,r*.15,0,0,TAU);g.fill();g.restore()}g.fillStyle='#6b4a2b';g.beginPath();g.arc(0,0,r*.12,0,TAU);g.fill()}
 else if(o.k==='rock'||o.k==='ice'){const ic=o.k==='ice';g.rotate(o.a);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(-r+5,-r*.7+6,r*2,r*1.4);g.fillStyle=ic?'#bfe3f7':'#8a8d93';g.beginPath();o.pts.forEach((w,i)=>{const t=i/8*TAU;g[i?'lineTo':'moveTo'](Math.cos(t)*r*w,Math.sin(t)*r*w*.8)});g.closePath();g.fill();g.fillStyle=ic?'#eefaff':'#a8abb1';g.beginPath();g.arc(-r*.2,-r*.2,r*.4,0,TAU);g.fill()}
 else if(o.k==='igloo'){g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.arc(6,8,r,0,TAU);g.fill();g.fillStyle='#f4fbff';g.beginPath();g.arc(0,0,r,0,TAU);g.fill();g.fillStyle='#cfe6f3';g.beginPath();g.arc(0,0,r*.6,0,TAU);g.fill();g.rotate(o.a);g.fillStyle='#4a6a80';g.fillRect(r*.6,-r*.2,r*.55,r*.4)}
 else if(o.k==='pagoda'){g.rotate(o.a);g.fillStyle='rgba(0,0,0,.28)';g.fillRect(-r*.9+8,-r*.9+10,r*1.8,r*1.8);for(let j=0;j<4;j++){const w=r*(1.8-j*.4);g.fillStyle=j%2?'#7a1f2b':'#b8323f';g.fillRect(-w/2,-w/2,w,w)}}

let TR=[];function buildTrees(){TR=[];buildDecor();for(let n=0;TR.length<320&&n<6000;n++){const x=-500+Math.random()*6200,y=-500+Math.random()*4500;let b=1e18;for(const p of S){const d=(p[0]-x)**2+(p[1]-y)**2;if(d<b)b=d}if(b>(RW/2+LIM+50)**2)TR.push({x,y,r:26+Math.random()*30})}}
loadMap(0);
function nearest(x,y,f){let b=1e18,bi=0;const t=i=>{const d=(S[i][0]-x)**2+(S[i][1]-y)**2;if(d<b){b=d;bi=i}};if(f<0)for(let i=0;i<M;i++)t(i);else for(let k=-20;k<=20;k++)t((f+k+M)%M);return bi}

const PT=[],SK=[];
function puff(x,y,c,r,l,sp){PT.push({x,y,vx:(Math.random()-.5)*sp,vy:(Math.random()-.5)*sp,l,m:l,r,c})}
function skid(c){const cs=Math.cos(c.a),sn=Math.sin(c.a);[-1,1].forEach((sd,j)=>{const x=c.x-cs*16-sn*sd*10,y=c.y-sn*16+cs*sd*10,k='p'+j;if(c[k])SK.push(c[k][0],c[k][1],x,y);c[k]=[x,y]});if(SK.length>4400)SK.splice(0,600)}
/* ---------- CAR ---------- */
class Car{

V.join=m=>showOv(`<h2>JOIN MATCH</h2><p class="sub">${m||'Enter the 5-letter match code'}</p><input id="jc" maxlength="5" placeholder="ABCDE" autocomplete="off"><div class="row"><button data-a="jgo">JOIN</button><button class="b2" data-a="play">BACK</button></div>`);
V.lobby=()=>{const h=lob.host;showOv(`<h2>MATCH LOBBY</h2><div class="code">${lob.code}</div>${h?optHtml(lob.cfg)+botHtml(lob.cfg):`${mpc(lob.cfg)}<p class="sub">${MAPN[lob.cfg.map]}${lob.cfg.night?' 🌙':''} · ${lob.cfg.laps} laps · ${lob.cfg.bots?lob.cfg.nb+' '+DIFF[lob.cfg.bd][0]+' bots':'no bots'}</p>`}<ol class="pl">${lob.p.map((x,j)=>`<li>${j?'🏁':'👑'} ${esc(x.name)}${h&&j?` <button class="b2 sm" data-a="kick" data-v="${x.id}">KICK</button>`:''}</li>`).join('')}</ol><p class="sub">${h?'Share the code · empty slots are filled with bots':'Waiting for the host to start…'}</p><div class="row">${h?'<button data-a="start">START MATCH</button>':''}<button class="b2" data-a="leave">LEAVE</button></div>`)};
/* lobby networking: published-app "room" capability = real cross-device play */
let RM=null,NR=null;
async function netJoin(code,pres){try{if(RM===null)RM=(window.claude&&await window.claude.use('room'))||0;if(!RM)return 0;NR=await RM.join('apex'+code.toLowerCase());NR.onPeers(netSync);await NR.presence(pres);return 1}catch(e){return 0}}
function leaveNet(){try{NR&&NR.leave()}catch(e){}NR=null;lob=null}
const netSet=q=>{try{NR&&NR.presence(q)}catch(e){}};
const roster=()=>{netSet({cfg:lob.cfg});go('lobby')};
function netSync(){if(!lob||!NR||state!=='menu')return;const ps=NR.peers().filter(x=>x.presence&&x.presence.id).sort((a,b)=>a.updatedAt-b.updatedAt),h=ps.find(x=>x.presence.h);if(!h)return;
 const hp=h.presence,kk=hp.k||[];if(!lob.host&&kk.includes(myId)){leaveNet();go('join');V.join('You were kicked from the match');return}
 const list=[{id:hp.id,name:hp.n}];ps.forEach(x=>{const q=x.presence;if(!q.h&&!kk.includes(q.id)&&list.length<5)list.push({id:q.id,name:q.n})});
 const first=!lob.ok;lob.p=list;lob.ok=1;
 if(!lob.host){lob.cfg=hp.cfg;if(first)lob.s=hp.s;else if(hp.s&&hp.s!==lob.s){lob.s=hp.s;startRace({mode:'online',names:list.filter(x=>x.id!==myId).map(x=>x.name),...cfgOf(hp.cfg)});return}}
 if(first||cur.n==='lobby')go('lobby')}
/* ---------- setup ---------- */
function applyMe(){const i=SV.sel,c=cfg(i),s=st(i);Object.assign(me,{sk:.72+s.e/300*.43,bk:.7+s.b/300*.7,tb:.6+s.t/300*.9,col:c.col,pst:c.st,tier:i,name:myName})}
function setup(o){const ot=[],pl=o.names||[],pool=ALL.filter(c=>c!==me),nb=o.mode==='bot'?4:(o.bots?o.nb:0),dd=o.mode==='bot'?o.diff:(o.bd||0);let n=0;
 const mk=(nm,hu)=>{const c=pool[n++],R=hu?[4,17]:[[0,3],[4,12],[13,19],[18,27]][dd],ti=R[0]+Math.floor(Math.random()*(R[1]-R[0]+1));
  Object.assign(c,{col:COLS[Math.floor(Math.random()*COLS.length)],tier:ti,pst:Math.floor(Math.random()*STY.length),bk:1,tb:1,lv:hu?1:dd,sk0:(hu?.94:[.84,.95,1.04,1.13][dd])*(.96+Math.random()*.04),name:nm||CAR[ti].n});ot.push(c)};
 pl.forEach(nm=>mk(nm,1));for(let k=0;k<nb;k++)mk(0,0);ot.splice(Math.min(3,ot.length),0,me);cars=ot;cars.forEach((c,k)=>c.i=k);applyMe()}
function toMenu(){NIGHT=0;leaveNet();state='menu';setup({mode:'bot',diff:1});cars.forEach(c=>c.reset());me.ai=true;PT.length=SK.length=0;go('main')}
ov.onclick=e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const a=el.dataset.a,v=el.dataset.v,n=+v;audio();
 switch(a){
 case'main':toMenu();break;case'play':go('play');break;case'shop':go('shop');break;case'cust':go('cust',SV.sel);break;
 case'bot':go('diff');break;case'd':startRace({mode:'bot',diff:n,laps:OPT.laps,map:OPT.map,night:OPT.night});break;case'again':startRace();break;
 case'sel':if(SV.own.includes(n)){SV.sel=n;sv();applyMe();go(cur.n,cur.a)}else flash('🔒 Locked · buy it in the SHOP');break;
 case'buy':if(SV.m>=CAR[n].price){SV.m-=CAR[n].price;SV.own.push(n);SV.sel=n;sv();applyMe();flash('Bought '+CAR[n].n+'!')}else flash('Not enough money · win more races');go('shop');break;
 case'cc':go('cust',n);break;
 case'upg':{const i=cur.a,c=cfg(i),p=upc(i,c[v]);if(c[v]<10&&SV.m>=p){SV.m-=p;c[v]++;sv();applyMe()}else flash('Not enough money');go('cust',i);break}
 case'col':cfg(cur.a).col=v;sv();applyMe();go('cust',cur.a);break;
 case'sty':{const i=cur.a,c=cfg(i),p=STY[n][1];if(!c.os.includes(n)){if(SV.m<p){flash('Not enough money');break}SV.m-=p;c.os.push(n)}c.st=n;sv();applyMe();go('cust',i);break}
 case'create':{lob={code:Math.random().toString(36).slice(2,7).toUpperCase(),host:1,cfg:{laps:3,map:0,bots:1,nb:3,bd:1,night:0},p:[{id:myId,name:myName}],k:[]};go('lobby');
  netJoin(lob.code,{id:myId,n:myName,h:1,cfg:lob.cfg,k:[]}).then(ok=>{if(!ok)flash('Online needs the published app link')});break}
 case'mp':case'lp':{const o=lob?lob.cfg:OPT;o[a==='mp'?'map':'laps']=n;if(lob)roster();else go(cur.n,cur.a);break}
 case'nt':{const o=lob?lob.cfg:OPT;o.night=o.night?0:1;if(lob)roster();else go(cur.n,cur.a);break}
 case'bt':lob.cfg.bots=lob.cfg.bots?0:1;roster();break;case'bd':lob.cfg.bd=n;roster();break;case'nb':lob.cfg.nb=n;roster();break;
 case'join':go('join');break;
 case'jgo':{const code=document.getElementById('jc').value.trim().toUpperCase();if(code.length<5){flash('Enter the 5-letter code');break}lob={code,host:0,p:[],ok:0};V.join('Joining…');
  netJoin(code,{id:myId,n:myName}).then(ok=>{if(!ok){lob=null;V.join('Online needs the published app link');return}setTimeout(()=>{if(lob&&!lob.ok&&!lob.host){leaveNet();V.join('No match found with that code')}},3000)});break}
 case'kick':lob.k.push(v);lob.p=lob.p.filter(x=>x.id!==v);netSet({k:lob.k});go('lobby');break;
 case'start':netSet({s:Date.now()});startRace({mode:'online',names:lob.p.filter(x=>x.id!==myId).map(x=>x.name),...cfgOf(lob.cfg)});break;
 case'leave':leaveNet();go('play');break}};
function finish(){state='done';me.ai=true;const L=rank(),p=L.indexOf(me)+1,pr=(cars.length>1&&p===cars.length)?0:prize(LO,p);SV.m+=pr;sv();
 showOv(`<h2>${(['','1ST 🏆','2ND','3RD'][p]||p+'TH')}</h2><p class="sub">Time ${fmt(me.fin)} · Best lap ${fmt(best)}</p><div class="money">+$${pr} · Total $${SV.m}</div><ol>${L.map((c,i)=>`<li style="color:${c===me?'#ffd60a':'#fff'}">${i+1}. ${esc(c.name)}</li>`).join('')}</ol><div class="row"><button data-a="again">RACE AGAIN</button><button class="b2" data-a="main">MENU</button></div>`)}

let last=performance.now(),lastDraw=0;
function frame(n){if(document.hidden){last=n;lastDraw=n;requestAnimationFrame(frame);return}if(n-lastDraw<1000/30){requestAnimationFrame(frame);return}const dt=Math.min(.033,(n-last)/1000);last=n;lastDraw=n;step(dt);draw();if(ov.style.display!=='none')r3();RS.style.display=(state==='race'||state==='count')?'block':'none';if(performance.now()-rt>2200)RS.textContent='RESIGN';TC.style.display=(DEV==='mobile'&&(state==='race'||state==='count'))?'flex':'none';BO.style.background=me.nc>0?'rgba(255,59,48,.6)':'';requestAnimationFrame(frame)}
/* ---------- mobile controls + boot sequence ---------- */
let JX=0,DEV=null,dv=0;const TC=document.getElementById('tc'),js=document.getElementById('js'),jk=document.getElementById('jk');
function jm(e){const r=js.getBoundingClientRect(),R=r.width/2;let dx=(e.clientX-r.left-R)/R,dy=(e.clientY-r.top-R)/R;const d=Math.hypot(dx,dy);if(d>1){dx/=d;dy/=d}JX=Math.abs(dx)<.08?0:dx;jk.style.transform=`translate(${dx*R*.6}px,${dy*R*.6}px)`}
js.onpointerdown=e=>{e.preventDefault();js.setPointerCapture(e.pointerId);jm(e)};js.onpointermove=e=>{if(js.hasPointerCapture(e.pointerId))jm(e)};
js.onpointerup=js.onpointercancel=()=>{JX=0;jk.style.transform=''};addEventListener('contextmenu',e=>e.preventDefault());
function boot(){toMenu();ov.style.display='none';const L=document.getElementById('ld'),C=document.getElementById('lc');
 C.innerHTML='<h1>Da<span>Drift</span></h1><div class="bar"><i id="pb"></i></div><p class="sub" id="pt">Loading…</p>';
 const msg=['Warming up engines…','Building the garage…','Laying asphalt…','Painting the cars…','Ready!'];let p=0;
 for(let i=0;i<28;i++)spec(i);
 const iv=setInterval(()=>{p=Math.min(100,p+2+Math.random()*4);document.getElementById('pb').style.width=p+'%';document.getElementById('pt').textContent=msg[Math.min(4,Math.floor(p/21))];if(p>=100){clearInterval(iv);setTimeout(opening,300)}},50);
 function opening(){C.innerHTML='<h1 style="font-size:72px;animation:zi .9s ease-out">Da<span>Drift</span></h1><p class="sub" style="animation:zi 1.3s ease-out;letter-spacing:4px">STREET CIRCUIT RACING</p><p class="sub">tap or press any key to continue</p>';L.onclick=device;addEventListener('keydown',()=>device(),{once:true})}
 function device(){if(dv)return;dv=1;L.onclick=null;C.innerHTML='<h2>CHOOSE YOUR DEVICE</h2><p class="sub">Controls adjust to your device</p><div class="row"><button data-d="pc">🖥️ PC<small>Keyboard</small></button><button data-d="mobile">📱 MOBILE<small>Joystick, pedals &amp; boost · landscape works best</small></button></div>';
  C.querySelectorAll('button').forEach(b=>b.onclick=()=>{DEV=b.dataset.d;if(DEV==='mobile'){try{document.documentElement.requestFullscreen()}catch(e){}}audio();nameStep()})}
 function nameStep(){C.innerHTML='<h2>WHAT\'S YOUR NAME?</h2><p class="sub">Other racers will see it</p><input id="nm" maxlength="12" placeholder="Racer name" style="letter-spacing:1px;font-size:24px;text-transform:none"><div class="row"><button id="nb">LET\'S RACE</button></div>';
  const ip=document.getElementById('nm');ip.value=SV.name||'';ip.focus();
  const fin=()=>{myName=(ip.value.trim()||'Racer'+Math.floor(100+Math.random()*900)).slice(0,12);SV.name=myName;sv();applyMe();L.style.opacity=0;setTimeout(()=>L.style.display='none',500);document.body.classList.toggle('mob',DEV==='mobile');ov.style.display='flex';go('main')};
  document.getElementById('nb').onclick=fin;ip.onkeydown=e=>{if(e.key==='Enter')fin()}}}
cx=me.x;cy=me.y;boot();requestAnimationFrame(frame);
</script></body></html>

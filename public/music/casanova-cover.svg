<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
<defs>
 <linearGradient id="pinksky" x1="0" y1="0" x2=".15" y2="1"><stop offset="0" stop-color="#f20bea"/><stop offset=".32" stop-color="#dc08e9"/><stop offset=".7" stop-color="#b813cf"/><stop offset="1" stop-color="#8b168f"/></linearGradient>
 <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff7bfb" stop-opacity=".08"/><stop offset="1" stop-color="#ff8aff" stop-opacity="0"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .2 0 0 0 0 .5 0 0 0 .12 0"/></filter>
</defs>

<script>
(function(){
  var masters = [];
  var NativeAudioContext = window.AudioContext || window.webkitAudioContext;
  if (NativeAudioContext && window.AudioNode && !window.__idaSansAudioPatched) {
    window.__idaSansAudioPatched = true;
    var nativeConnect = AudioNode.prototype.connect;
    var masterFor = new WeakMap();
    AudioNode.prototype.connect = function(destination) {
      var master = masterFor.get(this.context);
      if (master && destination === this.context.destination && this !== master) destination = master;
      return nativeConnect.apply(this, [destination].concat(Array.prototype.slice.call(arguments, 1)));
    };
    function WrappedAudioContext() {
      var ctx = Reflect.construct(NativeAudioContext, arguments, new.target || WrappedAudioContext);
      var master = ctx.createGain();
      master.gain.value = 1;
      nativeConnect.call(master, ctx.destination);
      masterFor.set(ctx, master);
      masters.push(master);
      return ctx;
    }
    WrappedAudioContext.prototype = NativeAudioContext.prototype;
    try { window.AudioContext = WrappedAudioContext; } catch(e) {}
    try { if (window.webkitAudioContext) window.webkitAudioContext = WrappedAudioContext; } catch(e) {}
  }
  var muted = false;
  var button;
  function paint(){ if(!button)return; button.innerHTML='<svg viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges"><path fill="#fff" d="M1 6h3l4-3v10l-4-3H1z"/>'+(muted?'<path fill="#fff" d="M10 4l1.5-1.5L13 4l1.5-1.5L16 4l-1.5 1.5L16 7l-1.5 1.5L13 7l-1.5 1.5L10 7l1.5-1.5z"/><path fill="#fff" d="M9 11l1.4-1.4 4 4L13 15z"/>':'<path fill="#fff" d="M10 5h2v2h2v2h-2v2h-2V9H8V7h2z"/>')+'</svg>'; button.setAttribute('aria-label',muted?'Unmute Sans game audio':'Mute Sans game audio'); button.setAttribute('aria-pressed',String(muted)); button.title=muted?'Unmute Sans game audio':'Mute Sans game audio'; }
  function toggle(){ muted=!muted; masters.forEach(function(m){try{m.gain.setTargetAtTime(muted?0:1,m.context.currentTime,.015)}catch(e){m.gain.value=muted?0:1}}); paint(); }
  button=document.getElementById('ida-sans-mute');if(button){button.addEventListener('click',toggle);paint();}
})();
</script>

<script>
(function(){
  var normalModeSelected = false, rewardSent = false, menuDismissed = false, price = document.getElementById("ida-sans-normal-price"), winMessage = document.getElementById("ida-sans-win-message");
  function layoutName(runtime){try{return String(runtime&&runtime.running_layout&&runtime.running_layout.name||"")}catch(e){return ""}}
  function showVictory(){
    if(rewardSent)return;
    rewardSent=true;
    if(price)price.style.display="none";
    if(winMessage)winMessage.style.display="block";
    try{window.parent.dispatchEvent(new CustomEvent("ida-badtime-normal-win",{detail:{source:window}}))}catch(e){}
  }
  function attach(){
    try{
      if(typeof window.cr_getC2Runtime!=="function"||!window.cr)return false;
      var runtime=window.cr_getC2Runtime(), p=window.cr.plugins_&&window.cr.plugins_.Function;
      var onFunction=p&&p.prototype&&p.prototype.cnds&&p.prototype.cnds.OnFunction;
      if(!runtime||typeof runtime.trigger!=="function"||!onFunction||runtime.__idaBadTimeRewardHooked)return !!(runtime&&runtime.__idaBadTimeRewardHooked);
      var originalTrigger=runtime.trigger;
      runtime.trigger=function(condition,instance){
        if(condition===onFunction&&instance){
          var name=String(instance.funcName||instance.functionName||"");
          if(name==="MenuModeNormal"){normalModeSelected=true;menuDismissed=true;rewardSent=false;if(winMessage)winMessage.style.display="none"}
          else if(/^MenuMode(Practice|Endless|Single|Custom)$/.test(name)){normalModeSelected=false;menuDismissed=true;rewardSent=false}
          else if(name==="Win1"&&normalModeSelected&&layoutName(runtime)==="BattleScreen")showVictory();
        }
        return originalTrigger.apply(this,arguments);
      };
      runtime.__idaBadTimeRewardHooked=true;
      return true;
    }catch(e){return false}
  }
  // The hosted Construct 2 build doesn't expose a stable layout name in every
  // browser build. Keep the pixel-font price visible on the menu and hide it as
  // soon as the player clicks a mode; no runtime-layout-name guess is required.
  function updatePrice(){if(price)price.style.display=(!menuDismissed&&!rewardSent)?"block":"none"}
  document.addEventListener("click",function(event){
    if(!price)return;
    var y=event.clientY/window.innerHeight;
    if(y>0.19&&y<0.55){menuDismissed=true;price.style.display="none"}
  },true);
  var tries=0,timer=window.setInterval(function(){tries++;attach();updatePrice();if(tries>240)window.clearInterval(timer)},100);
})();
</script>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>IDA</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="desktop" aria-label="IDA desktop">
    <div id="desktopIcons" class="desktop-icons"></div>
    <div id="windows"></div>

    <div id="startMenu" class="start-menu hidden">
      <div class="start-title"><span class="hilal">☾</span><span>IDA</span></div>
      <div id="startApps"></div>
    </div>

    <div id="shutdownMenu" class="shutdown-menu hidden">
      <button data-power="shutdown">Shut down</button>
      <button data-power="sleep">Sleep</button>
      <button data-power="restart">Restart</button>
    </div>

    <div id="searchPanel" class="search-panel hidden">
      <input id="searchInput" autocomplete="off" placeholder="Search IDA">
      <div id="searchResults"></div>
    </div>

    <footer id="taskbar" class="taskbar">
      <button id="startButton" class="start-button" aria-label="Start"><span class="hilal">☾</span></button>
      <button id="searchButton" class="search-button">Search</button>
      <div id="taskbarApps" class="taskbar-apps"></div>
      <div class="tray">
        <button id="wifiButton" title="Internet">⌁</button>
        <span>ENG</span><span>🔊</span><span>🔋</span>
        <span id="clock"></span>
      </div>
    </footer>
  </main>
  <script src="./app.js"></script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#080b12"/><style>html,body{margin:0;width:100%;height:100%;background:#05070d}#root{min-height:100%;height:100%}.ida-boot{height:100%;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 42%,#12182b 0%,#070a12 55%,#030408 100%);color:#fff;font:12px system-ui,sans-serif}.ida-boot-inner{display:grid;justify-items:center;gap:14px}.ida-boot-moon{position:relative;width:42px;height:42px;border-radius:50%;background:#fff;filter:drop-shadow(0 0 18px #c8d5ff66)}.ida-boot-moon:after{content:"";position:absolute;width:42px;height:42px;left:12px;top:-7px;border-radius:50%;background:#0a0d17}.ida-boot-label{color:#aeb9d3;letter-spacing:.22em;font-size:10px}.ida-boot-dots{display:flex;gap:5px}.ida-boot-dots i{width:4px;height:4px;border-radius:50%;background:#e7ecff;opacity:.3;animation:ida-boot-dot 1s infinite}.ida-boot-dots i:nth-child(2){animation-delay:.15s}.ida-boot-dots i:nth-child(3){animation-delay:.3s}@keyframes ida-boot-dot{40%{opacity:1;transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){.ida-boot-dots i{animation:none;opacity:.8}}</style><title>IDA</title><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23080b12%22%2F%3E%3Ccircle%20cx%3D%2231%22%20cy%3D%2232%22%20r%3D%2221%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2225%22%20r%3D%2221%22%20fill%3D%22%23080b12%22%2F%3E%3C%2Fsvg%3E"/></head><body><div id="root"><div class="ida-boot" role="status" aria-label="Loading IDA"><div class="ida-boot-inner"><div class="ida-boot-moon"></div><div class="ida-boot-label">STARTING IDA</div><div class="ida-boot-dots"><i></i><i></i><i></i></div></div></div></div><script type="module" src="./src/main.tsx"></script></body></html>
